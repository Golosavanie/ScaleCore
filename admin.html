<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ScaleCore — Админ-панель</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#030307;
  --panel:rgba(255,255,255,.04);
  --border:rgba(255,255,255,.10);
  --text:#fff;
  --muted:#8a8a93;
  --ease:cubic-bezier(.16,1,.3,1);
  --new:#6c7eff;
  --accepted:#4ade80;
  --rejected:#f87171;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Plus Jakarta Sans',sans-serif;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:radial-gradient(ellipse at 50% 0%,#08080f 0%,#04040a 55%,#020205 100%);
  color:var(--text);min-height:100vh;overflow-x:hidden;line-height:1.5;
}
button,input,select{font-family:inherit}
.hidden{display:none!important}

::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.25)}

/* ============ LOGIN ============ */
#login-screen{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  padding:20px;z-index:100;
  background:radial-gradient(ellipse at 50% 0%,#08080f 0%,#04040a 55%,#020205 100%);
}
.login-box{
  width:100%;max-width:420px;padding:44px 36px;border-radius:28px;
  background:rgba(16,16,20,.85);backdrop-filter:blur(30px) saturate(180%);
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 40px 100px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.15);
  text-align:center;
  position:relative;overflow:hidden;
}
.login-box::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);
}
.login-mark{
  width:64px;height:64px;border-radius:20px;margin:0 auto 22px;
  background:#fff;color:#000;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:22px;letter-spacing:-1px;
  box-shadow:0 0 50px rgba(255,255,255,.5);
}
.login-box h1{font-size:22px;font-weight:800;letter-spacing:-.5px;margin-bottom:6px}
.login-box p{font-size:13px;color:var(--muted);margin-bottom:26px}
.login-input{
  width:100%;padding:16px 18px;border-radius:14px;
  background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.15);
  color:#fff;font-size:14px;outline:0;text-align:center;letter-spacing:2px;
  transition:border-color .35s, box-shadow .35s, background .35s;
}
.login-input:focus{border-color:rgba(255,255,255,.6);background:rgba(0,0,0,.75);box-shadow:0 0 0 4px rgba(255,255,255,.06)}
.login-btn{
  width:100%;margin-top:14px;padding:16px;border-radius:14px;
  background:#fff;color:#000;border:none;cursor:pointer;
  font-weight:800;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;
  transition:transform .35s var(--ease), box-shadow .35s var(--ease);
}
.login-btn:hover{transform:translateY(-2px);box-shadow:0 12px 36px rgba(255,255,255,.4)}
.login-btn:active{transform:scale(.97)}
.login-error{
  margin-top:14px;font-size:12px;color:#f87171;font-weight:700;min-height:16px;
}

/* ============ DASHBOARD ============ */
#dashboard{padding:24px;max-width:1400px;margin:0 auto}

.dash-header{
  display:flex;align-items:center;justify-content:space-between;gap:20px;
  padding:18px 22px;border-radius:20px;margin-bottom:20px;
  background:rgba(16,16,20,.7);border:1px solid rgba(255,255,255,.1);
  backdrop-filter:blur(20px);flex-wrap:wrap;
}
.dash-logo{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:3px;font-size:13px}
.dash-logo-mark{
  width:34px;height:34px;border-radius:10px;background:#fff;color:#000;
  display:flex;align-items:center;justify-content:center;font-size:13px;letter-spacing:-1px;
}
.dash-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn-dash{
  padding:10px 18px;border-radius:12px;border:1px solid rgba(255,255,255,.15);
  background:rgba(255,255,255,.05);color:#fff;cursor:pointer;
  font-size:11px;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;
  transition:all .3s var(--ease);
}
.btn-dash:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.35);transform:translateY(-1px)}
.btn-dash.danger{border-color:rgba(248,113,113,.35);color:#f87171}
.btn-dash.danger:hover{background:rgba(248,113,113,.12);border-color:#f87171}

/* STATS */
.stats-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px;
}
.stat-card{
  padding:20px;border-radius:18px;
  background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,.012));
  border:1px solid rgba(255,255,255,.08);
  transition:transform .4s var(--ease), border-color .3s;
}
.stat-card:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.2)}
.stat-card .lbl{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.stat-card .val{font-size:30px;font-weight:800;letter-spacing:-1.2px;line-height:1;font-variant-numeric:tabular-nums}
.stat-card.new .val{color:var(--new)}
.stat-card.accepted .val{color:var(--accepted)}
.stat-card.rejected .val{color:var(--rejected)}

/* TABS */
.tabs-nav{
  display:flex;gap:6px;padding:6px;border-radius:16px;margin-bottom:20px;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);
  width:fit-content;
}
.tab-btn{
  padding:11px 22px;border-radius:11px;background:transparent;border:none;
  color:var(--muted);font-weight:800;font-size:12px;letter-spacing:1.3px;
  text-transform:uppercase;cursor:pointer;transition:all .35s var(--ease);
}
.tab-btn.active{background:#fff;color:#000;box-shadow:0 4px 20px rgba(255,255,255,.25)}
.tab-btn:not(.active):hover{color:#fff;background:rgba(255,255,255,.06)}

/* FILTERS */
.filters{
  display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center;
}
.filter-chip{
  padding:8px 14px;border-radius:20px;background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.1);color:var(--muted);
  font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;
  cursor:pointer;transition:all .3s var(--ease);
}
.filter-chip:hover{color:#fff;border-color:rgba(255,255,255,.3)}
.filter-chip.active{background:#fff;color:#000;border-color:#fff}
.filter-chip .num{opacity:.6;margin-left:4px}

/* ORDERS LIST */
.orders-list{display:flex;flex-direction:column;gap:12px}
.order-card{
  padding:22px;border-radius:20px;
  background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,.012));
  border:1px solid rgba(255,255,255,.08);
  transition:transform .4s var(--ease), border-color .3s, box-shadow .4s;
  position:relative;overflow:hidden;
}
.order-card::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--new);
}
.order-card.status-accepted::before{background:var(--accepted)}
.order-card.status-rejected::before{background:var(--rejected)}
.order-card:hover{border-color:rgba(255,255,255,.22);transform:translateY(-3px);box-shadow:0 20px 50px rgba(0,0,0,.5)}

.order-top{
  display:flex;justify-content:space-between;align-items:flex-start;gap:16px;
  margin-bottom:14px;flex-wrap:wrap;
}
.order-name{font-size:17px;font-weight:800;letter-spacing:-.3px;margin-bottom:2px}
.order-contact{font-size:13px;color:var(--muted);font-weight:600}
.order-contact a{color:#fff;text-decoration:none;border-bottom:1px dashed rgba(255,255,255,.3)}
.order-contact a:hover{border-bottom-color:#fff}

.status-badge{
  padding:5px 12px;border-radius:20px;font-size:10px;font-weight:800;
  letter-spacing:1.5px;text-transform:uppercase;white-space:nowrap;
  border:1px solid;flex-shrink:0;
}
.status-badge.new{color:var(--new);background:rgba(108,126,255,.1);border-color:rgba(108,126,255,.3)}
.status-badge.accepted{color:var(--accepted);background:rgba(74,222,128,.1);border-color:rgba(74,222,128,.3)}
.status-badge.rejected{color:var(--rejected);background:rgba(248,113,113,.1);border-color:rgba(248,113,113,.3)}

.order-meta-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:10px;margin-bottom:14px;padding:14px;border-radius:14px;
  background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.05);
}
.meta-item{display:flex;flex-direction:column;gap:3px}
.meta-lbl{font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
.meta-val{font-size:13px;font-weight:700;color:#fff;word-break:break-word}

.order-desc{
  padding:14px;border-radius:14px;background:rgba(0,0,0,.25);
  border:1px solid rgba(255,255,255,.05);
  font-size:13px;line-height:1.65;color:#cfcfd6;
  margin-bottom:14px;white-space:pre-wrap;word-break:break-word;
}

.order-footer{
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  flex-wrap:wrap;
}
.order-date{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.3px}
.order-actions{display:flex;gap:8px;flex-wrap:wrap}
.act-btn{
  padding:9px 16px;border-radius:11px;border:1px solid;cursor:pointer;
  font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;
  transition:all .3s var(--ease);background:transparent;
}
.act-btn.accept{color:var(--accepted);border-color:rgba(74,222,128,.35);background:rgba(74,222,128,.08)}
.act-btn.accept:hover{background:rgba(74,222,128,.2);border-color:var(--accepted);transform:translateY(-1px)}
.act-btn.reject{color:var(--rejected);border-color:rgba(248,113,113,.35);background:rgba(248,113,113,.08)}
.act-btn.reject:hover{background:rgba(248,113,113,.2);border-color:var(--rejected);transform:translateY(-1px)}
.act-btn.delete{color:var(--muted);border-color:rgba(255,255,255,.15)}
.act-btn.delete:hover{color:#fff;border-color:rgba(255,255,255,.4);background:rgba(255,255,255,.05)}
.act-btn:active{transform:scale(.97)}

/* REVIEWS */
.reviews-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;
}
.review-card{
  padding:22px;border-radius:20px;
  background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,.012));
  border:1px solid rgba(255,255,255,.08);
  display:flex;flex-direction:column;gap:12px;
  transition:transform .4s var(--ease), border-color .3s;
}
.review-card:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.22)}
.review-top{display:flex;align-items:center;gap:12px}
.review-avatar{
  width:42px;height:42px;border-radius:50%;
  background:linear-gradient(135deg,#fff,#a89bff);color:#000;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex-shrink:0;
}
.review-meta{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.review-name{font-size:14px;font-weight:800;letter-spacing:-.2px}
.review-date{font-size:11px;color:var(--muted)}
.stars-row{display:flex;gap:3px}
.stars-row svg{width:16px;height:16px;fill:#fff;stroke:none}
.stars-row svg.empty{fill:rgba(255,255,255,.15)}
.review-text{font-size:13.5px;color:#ccc;line-height:1.65;word-break:break-word}
.review-service{
  font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;
  font-weight:700;padding-top:10px;border-top:1px solid rgba(255,255,255,.06);
}
.review-actions{display:flex;justify-content:flex-end;margin-top:4px}

/* EMPTY */
.empty{
  padding:70px 24px;text-align:center;border-radius:22px;
  background:rgba(255,255,255,.02);border:1px dashed rgba(255,255,255,.12);
}
.empty-icon{
  width:64px;height:64px;border-radius:20px;margin:0 auto 18px;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);
  display:flex;align-items:center;justify-content:center;
}
.empty-icon svg{width:30px;height:30px;stroke:rgba(255,255,255,.4);fill:none;stroke-width:1.8}
.empty h3{font-size:18px;font-weight:800;letter-spacing:-.4px;margin-bottom:6px}
.empty p{font-size:13px;color:var(--muted)}

/* TOAST */
#toasts{
  position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:9999;
  display:flex;flex-direction:column;gap:8px;pointer-events:none;
  width:calc(100% - 40px);max-width:400px;
}
.toast{
  padding:14px 22px;border-radius:14px;
  background:rgba(18,18,22,.96);backdrop-filter:blur(20px);
  color:#fff;font-weight:700;font-size:13px;text-align:center;
  border:1px solid rgba(255,255,255,.15);
  box-shadow:0 14px 40px rgba(0,0,0,.8);
  animation:slideDown .4s var(--ease);
}
.toast.ok{border-color:rgba(74,222,128,.4)}
.toast.err{border-color:rgba(248,113,113,.4)}
@keyframes slideDown{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:translateY(0)}}

/* RESPONSIVE */
@media (max-width:640px){
  #dashboard{padding:14px}
  .dash-header{padding:14px 16px;border-radius:16px}
  .order-card{padding:18px}
  .stats-grid{grid-template-columns:repeat(2,1fr);gap:8px}
  .stat-card{padding:14px}
  .stat-card .val{font-size:24px}
  .tab-btn{padding:9px 14px;font-size:11px}
  .tabs-nav{padding:5px}
  .act-btn{padding:8px 12px;font-size:10px}
  .login-box{padding:32px 24px}
}
</style>
</head>
<body>

<div id="toasts"></div>

<!-- ============== LOGIN ============== -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-mark">SC</div>
    <h1>Админ-панель</h1>
    <p>ScaleCore Control Center</p>
    <input type="password" id="login-pass" class="login-input" placeholder="Введите пароль" autocomplete="current-password">
    <button class="login-btn" id="login-btn">Войти</button>
    <div class="login-error" id="login-err"></div>
  </div>
</div>

<!-- ============== DASHBOARD ============== -->
<div id="dashboard" class="hidden">

  <div class="dash-header">
    <div class="dash-logo">
      <div class="dash-logo-mark">SC</div>
      <span>SCALECORE · ADMIN</span>
    </div>
    <div class="dash-actions">
      <button class="btn-dash" onclick="refreshAll()">↻ Обновить</button>
      <button class="btn-dash danger" onclick="logout()">Выйти</button>
    </div>
  </div>

  <div class="stats-grid">
    <div class="stat-card"><div class="lbl">Всего заявок</div><div class="val" id="stat-total">0</div></div>
    <div class="stat-card new"><div class="lbl">Новые</div><div class="val" id="stat-new">0</div></div>
    <div class="stat-card accepted"><div class="lbl">Принятые</div><div class="val" id="stat-accepted">0</div></div>
    <div class="stat-card rejected"><div class="lbl">Отклонённые</div><div class="val" id="stat-rejected">0</div></div>
    <div class="stat-card"><div class="lbl">Отзывы</div><div class="val" id="stat-reviews">0</div></div>
  </div>

  <div class="tabs-nav">
    <button class="tab-btn active" data-tab="orders">Заказы</button>
    <button class="tab-btn" data-tab="reviews">Отзывы</button>
  </div>

  <!-- ============ ORDERS TAB ============ -->
  <div id="tab-orders">
    <div class="filters" id="filters">
      <button class="filter-chip active" data-filter="all">Все <span class="num" id="f-all">0</span></button>
      <button class="filter-chip" data-filter="new">Новые <span class="num" id="f-new">0</span></button>
      <button class="filter-chip" data-filter="accepted">Принятые <span class="num" id="f-accepted">0</span></button>
      <button class="filter-chip" data-filter="rejected">Отклонённые <span class="num" id="f-rejected">0</span></button>
    </div>
    <div class="orders-list" id="orders-list"></div>
  </div>

  <!-- ============ REVIEWS TAB ============ -->
  <div id="tab-reviews" class="hidden">
    <div class="reviews-grid" id="reviews-list"></div>
  </div>

</div>

<script>
/* ============================================================
   STATE
   ============================================================ */
let adminPass = localStorage.getItem('sc_admin_pass') || '';
let ordersCache = [];
let reviewsCache = [];
let currentFilter = 'all';

/* ============================================================
   API HELPER
   ============================================================ */
async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: {
      'Content-Type': 'application/json',
      'x-admin-password': adminPass,
      ...(opts.headers || {})
    }
  });
  if (res.status === 401) {
    logout();
    throw new Error('Unauthorized');
  }
  return res.json();
}

/* ============================================================
   LOGIN
   ============================================================ */
const loginBtn = document.getElementById('login-btn');
const loginPass = document.getElementById('login-pass');
const loginErr = document.getElementById('login-err');

loginBtn.addEventListener('click', tryLogin);
loginPass.addEventListener('keydown', e => { if (e.key === 'Enter') tryLogin(); });

async function tryLogin() {
  const pass = loginPass.value.trim();
  if (!pass) { loginErr.textContent = 'Введите пароль'; return; }
  loginErr.textContent = '';
  loginBtn.disabled = true;
  loginBtn.textContent = 'Проверка...';
  try {
    const r = await fetch('/api/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pass })
    });
    const j = await r.json();
    if (j.ok) {
      adminPass = pass;
      localStorage.setItem('sc_admin_pass', pass);
      showDashboard();
    } else {
      loginErr.textContent = j.error || 'Неверный пароль';
      loginPass.value = '';
    }
  } catch (e) {
    loginErr.textContent = 'Ошибка соединения';
  } finally {
    loginBtn.disabled = false;
    loginBtn.textContent = 'Войти';
  }
}

function showDashboard() {
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('dashboard').classList.remove('hidden');
  refreshAll();
}

function logout() {
  adminPass = '';
  localStorage.removeItem('sc_admin_pass');
  document.getElementById('dashboard').classList.add('hidden');
  document.getElementById('login-screen').classList.remove('hidden');
  loginPass.value = '';
}

/* ============================================================
   AUTO LOGIN
   ============================================================ */
if (adminPass) {
  fetch('/api/admin/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password: adminPass })
  }).then(r => r.json()).then(j => {
    if (j.ok) showDashboard();
    else { adminPass = ''; localStorage.removeItem('sc_admin_pass'); }
  }).catch(() => {});
}

/* ============================================================
   TABS
   ============================================================ */
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const tab = btn.dataset.tab;
    document.getElementById('tab-orders').classList.toggle('hidden', tab !== 'orders');
    document.getElementById('tab-reviews').classList.toggle('hidden', tab !== 'reviews');
  });
});

/* ============================================================
   FILTERS
   ============================================================ */
document.querySelectorAll('.filter-chip').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-chip').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderOrders();
  });
});

/* ============================================================
   LOAD
   ============================================================ */
async function refreshAll() {
  try {
    const [o, r] = await Promise.all([
      api('/api/orders'),
      api('/api/reviews')
    ]);
    ordersCache = o.orders || [];
    reviewsCache = r.reviews || [];
    renderStats();
    renderOrders();
    renderReviews();
  } catch (e) {
    console.warn(e);
  }
}

/* ============================================================
   STATS
   ============================================================ */
function renderStats() {
  const total = ordersCache.length;
  const nw = ordersCache.filter(o => o.status === 'new').length;
  const acc = ordersCache.filter(o => o.status === 'accepted').length;
  const rej = ordersCache.filter(o => o.status === 'rejected').length;

  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-new').textContent = nw;
  document.getElementById('stat-accepted').textContent = acc;
  document.getElementById('stat-rejected').textContent = rej;
  document.getElementById('stat-reviews').textContent = reviewsCache.length;

  document.getElementById('f-all').textContent = total;
  document.getElementById('f-new').textContent = nw;
  document.getElementById('f-accepted').textContent = acc;
  document.getElementById('f-rejected').textContent = rej;
}

/* ============================================================
   ORDERS
   ============================================================ */
const TYPE_MAP = {
  landing: 'Лендинг',
  corporate: 'Корпоративный сайт',
  shop: 'Интернет-магазин',
  webapp: 'Веб-приложение',
  custom: 'Другое / не знаю'
};
const STATUS_MAP = {
  new: 'Новая',
  accepted: 'Принята',
  rejected: 'Отклонена'
};

function fmtDate(ts) {
  const d = new Date(ts);
  const months = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
  const pad = n => String(n).padStart(2, '0');
  return `${pad(d.getDate())} ${months[d.getMonth()]} ${d.getFullYear()} · ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function fmtBudget(n) {
  return (Number(n) || 0).toLocaleString('ru-RU') + ' ₽';
}
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderOrders() {
  const list = document.getElementById('orders-list');
  const filtered = currentFilter === 'all'
    ? ordersCache
    : ordersCache.filter(o => o.status === currentFilter);

  if (!filtered.length) {
    list.innerHTML = `
      <div class="empty">
        <div class="empty-icon"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div>
        <h3>Заявок нет</h3>
        <p>Как только клиент отправит форму — заявка появится здесь.</p>
      </div>`;
    return;
  }

  list.innerHTML = filtered.map(o => `
    <div class="order-card status-${o.status}">
      <div class="order-top">
        <div>
          <div class="order-name">${esc(o.name)}</div>
          <div class="order-contact">
            📞 <a href="tel:${esc(o.phone)}">${esc(o.phone)}</a>
          </div>
        </div>
        <div class="status-badge ${o.status}">${STATUS_MAP[o.status] || o.status}</div>
      </div>

      <div class="order-meta-grid">
        <div class="meta-item">
          <div class="meta-lbl">Тип проекта</div>
          <div class="meta-val">${esc(TYPE_MAP[o.type] || o.type)}</div>
        </div>
        <div class="meta-item">
          <div class="meta-lbl">Бюджет</div>
          <div class="meta-val">${fmtBudget(o.budget)}</div>
        </div>
        <div class="meta-item">
          <div class="meta-lbl">Дата</div>
          <div class="meta-val">${fmtDate(o.date)}</div>
        </div>
        ${o.ip ? `<div class="meta-item"><div class="meta-lbl">IP</div><div class="meta-val">${esc(o.ip)}</div></div>` : ''}
      </div>

      <div class="order-desc">${esc(o.description)}</div>

      <div class="order-footer">
        <div class="order-date">
          ${o.ua ? '🌐 ' + esc(o.ua.slice(0, 80)) + (o.ua.length > 80 ? '…' : '') : ''}
        </div>
        <div class="order-actions">
          ${o.status !== 'accepted' ? `<button class="act-btn accept" onclick="setStatus('${o.id}','accepted')">✓ Принять</button>` : ''}
          ${o.status !== 'rejected' ? `<button class="act-btn reject" onclick="setStatus('${o.id}','rejected')">✕ Отклонить</button>` : ''}
          <button class="act-btn delete" onclick="deleteOrder('${o.id}')">🗑 Удалить</button>
        </div>
      </div>
    </div>
  `).join('');
}

async function setStatus(id, status) {
  try {
    await api('/api/orders/' + id, {
      method: 'PATCH',
      body: JSON.stringify({ status })
    });
    const o = ordersCache.find(x => x.id === id);
    if (o) o.status = status;
    renderStats();
    renderOrders();
    toast(status === 'accepted' ? 'Заявка принята' : 'Заявка отклонена', 'ok');
  } catch (e) {
    toast('Ошибка обновления', 'err');
  }
}

async function deleteOrder(id) {
  if (!confirm('Удалить заявку безвозвратно?')) return;
  try {
    await api('/api/orders/' + id, { method: 'DELETE' });
    ordersCache = ordersCache.filter(o => o.id !== id);
    renderStats();
    renderOrders();
    toast('Заявка удалена', 'ok');
  } catch (e) {
    toast('Ошибка удаления', 'err');
  }
}

/* ============================================================
   REVIEWS
   ============================================================ */
function starsSvg(n) {
  let h = '';
  for (let i = 1; i <= 5; i++) {
    h += `<svg viewBox="0 0 24 24" class="${i <= n ? '' : 'empty'}"><path d="M12 2l3 6 6 .9-4.5 4.3 1 6.3L12 16.7 6.5 19.5l1-6.3L3 8.9 9 8z"/></svg>`;
  }
  return h;
}

function renderReviews() {
  const list = document.getElementById('reviews-list');
  if (!reviewsCache.length) {
    list.innerHTML = `
      <div class="empty" style="grid-column:1/-1">
        <div class="empty-icon"><svg viewBox="0 0 24 24"><path d="M12 2l3 6 6 .9-4.5 4.3 1 6.3L12 16.7 6.5 19.5l1-6.3L3 8.9 9 8z"/></svg></div>
        <h3>Отзывов нет</h3>
        <p>Отзывы появятся здесь, как только клиенты их оставят.</p>
      </div>`;
    return;
  }

  list.innerHTML = reviewsCache.map(r => `
    <div class="review-card">
      <div class="review-top">
        <div class="review-avatar">${esc((r.name || 'A').slice(0,1).toUpperCase())}</div>
        <div class="review-meta">
          <div class="review-name">${esc(r.name || 'Аноним')}</div>
          <div class="review-date">${fmtDate(r.date)}</div>
        </div>
      </div>
      <div class="stars-row">${starsSvg(r.rating)}</div>
      <div class="review-text">${esc(r.text)}</div>
      <div class="review-service">${esc(r.service || 'Проект')}</div>
      <div class="review-actions">
        <button class="act-btn delete" onclick="deleteReview('${r.id}')">🗑 Удалить</button>
      </div>
    </div>
  `).join('');
}

async function deleteReview(id) {
  if (!confirm('Удалить отзыв?')) return;
  try {
    await api('/api/reviews/' + id, { method: 'DELETE' });
    reviewsCache = reviewsCache.filter(r => r.id !== id);
    renderStats();
    renderReviews();
    toast('Отзыв удалён', 'ok');
  } catch (e) {
    toast('Ошибка удаления', 'err');
  }
}

/* ============================================================
   TOAST
   ============================================================ */
function toast(msg, kind = 'ok') {
  const c = document.getElementById('toasts');
  const t = document.createElement('div');
  t.className = 'toast ' + kind;
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(() => {
    t.style.opacity = '0';
    t.style.transform = 'translateY(-12px)';
    t.style.transition = 'opacity .3s, transform .3s';
    setTimeout(() => t.remove(), 320);
  }, 2800);
}

/* ============================================================
   AUTO REFRESH
   ============================================================ */
setInterval(() => {
  if (!document.getElementById('dashboard').classList.contains('hidden')) {
    refreshAll();
  }
}, 30000);
</script>
